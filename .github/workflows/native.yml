name: native

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: native

jobs:
  check:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck (TypeScript 7)
        run: npm run typecheck

      - name: Test (Jest)
        run: npm test -- --ci

      # Expo はパッチ版（例: 57.0.26 → 57.0.27）を頻繁に出すので、そのたびに CI が赤くならないよう
      # expo-doctor は失敗扱いにせず、問題があれば警告として表示するだけにする。
      # 警告が出たら、ブランチを切って `npx expo install --fix` で上げる。
      - name: Expo doctor (warning only)
        continue-on-error: true
        run: |
          if ! npx expo-doctor; then
            echo "::warning title=expo-doctor::依存関係に問題があります。native で npx expo install --fix を実行してください"
            exit 1
          fi

      # ネイティブのバイナリまでは作らず、iOS / Android の JS バンドルが作れるかを確認する
      # （実機用のビルドは EAS Build で行う）
      - name: Build JS bundles (iOS / Android)
        run: npx expo export --platform ios --platform android --output-dir dist
